<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沢多恩 | Artist Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(180deg,#070812,#0c1022 40%,#080914);
  color:#f2f4ff;
}

/* HERO */
.hero{
  height:85vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#1b2044 0%,#080914 70%);
}

.hero h1{
  font-size:3.2em;
  letter-spacing:6px;
  margin:0;
  background:linear-gradient(90deg,#fff,#9aa7ff,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:20px;
  color:#c8ccff;
  max-width:600px;
}

/* 섹션 공통 */
.section{
  padding:80px 20px;
  max-width:1000px;
  margin:auto;
}

.section-title{
  font-size:1.6em;
  margin-bottom:40px;
  letter-spacing:2px;
  border-left:4px solid #6f7dff;
  padding-left:15px;
}

/* 대표작 */
.featured{
  display:flex;
  gap:30px;
  flex-wrap:wrap;
}

.featured video,
.featured img{
  width:100%;
  max-width:480px;
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

/* 작품 카드 */
.work-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.work{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
  backdrop-filter:blur(8px);
  transition:0.3s;
}

.work:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 35px rgba(0,0,0,0.6);
}

.work img,.work video{
  width:100%;
  border-radius:10px;
  margin-bottom:15px;
}

.work h3{
  margin:0 0 8px 0;
}

.work p{
  font-size:0.9em;
  color:#cfcfff;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 20px;
  border-radius:30px;
  background:linear-gradient(90deg,#5865ff,#8f9cff);
  color:#fff;
  text-decoration:none;
}

/* SNS */
.links{
  text-align:center;
  padding:60px 0;
}

.links a{
  margin:0 15px;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

footer{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>沢多恩</h1>
  <p>歌・演奏・調声を行うアーティスト。UTAU音源「沢音オフ」提供者。</p>
</section>

<!-- FEATURED WORK -->
<section class="section">
  <div class="section-title">Featured Work</div>
  <div class="featured">
    <video controls src="https://cdn.jsdelivr.net/gh/sawadaon/sawadaon/vLMTG3vwJXD6ErSB.mp4"></video>
    <video controls src="https://github.com/sawadaon/sawadaon/raw/main/Tele.mp4"></video>
  </div>
</section>

<!-- VOICEBANK -->
<section class="section">
  <div class="section-title">Voicebank</div>
  <div class="work-grid">

    <div class="work">
      <img src="https://cdn.jsdelivr.net/gh/sawadaon/sawadaon/sawaneoff.jpg">
      <h3>沢音オフ</h3>
      <p>voice provider：沢多恩</p>
      <a class="btn" href="https://bowlroll.net/file/347586" target="_blank">Download</a>
    </div>

  </div>
</section>

<!-- COVERS -->
<section class="section">
  <div class="section-title">Works / Covers</div>
  <div class="work-grid">

    <div class="work">
      <img src="https://cdn.jsdelivr.net/gh/sawadaon/sawadaon/off_demo.jpg">
      <h3>UTAUカバー</h3>
      <p>tuning･mix：沢多恩</p>
      <a class="btn" href="https://youtu.be/hALBKqm9QFQ" target="_blank">Listen</a>
    </div>

  </div>
</section>

<!-- SNS -->
<div class="links">
  <a href="https://www.youtube.com/@sawadaon" target="_blank">YouTube</a>
  <a href="https://x.com/on3ic" target="_blank">X / Twitter</a>
</div>

<footer>
  contact | sawadaon3@gmail.com
</footer>

</body>
</html>
