<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沢多恩 / Sawada On</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
html { scroll-behavior: smooth; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin:0;
  font-family: 'Noto Serif JP', serif;
  background: #f8f8f8;
  color: #111;
  line-height: 1.6;
}

header { text-align: center; padding: 50px 20px 30px; }
header h1 { margin: 0; font-size: 2.4em; font-weight: 600; color: #222; }
@media (max-width: 600px) { header h1 { font-size: 1.8em; } }
header h2 { margin: 5px 0 0; font-size: 1.2em; font-weight: 400; color: #555; }

nav { margin-top: 25px; display: flex; justify-content: center; gap: 30px; font-size: 14px; }
nav a { text-decoration: none; color: #111; font-weight: 600; transition: color 0.3s; }
nav a:hover { color: #555; }

section { max-width: 920px; margin: 50px auto 30px auto; padding: 0 20px; }

.card {
  display: flex;
  flex-wrap: wrap;
  margin-bottom: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
  align-items: flex-start;
}

.card .video-wrap {
  flex: 1 1 50%;
  max-width: 560px;
  width: 100%;
  position: relative;
  padding-top: 56.25%;
}

.card .video-wrap iframe,
.card .video-wrap video {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card .video-wrap video { border: 1px solid #111; }

.card .info {
  flex: 1 1 50%;
  padding-left: 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card .info .title { font-weight: 600; font-size: 1.3em; margin-bottom: 8px; }
.card .info .credit { font-size: 14px; color: #555; margin-bottom: 12px; }
.card .info .credit p { margin: 3px 0; }

/* ✨ 각주 스타일 추가 */
.card .info .credit .note {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

/* 다운로드 버튼 */
.card .info .download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: #111;
  text-decoration: none;
}
.card .info .download span.arrow { transform: rotate(-45deg); }
.card .info .download:hover { color: #0073e6; }

.sns-section { border-top: 1px solid #ddd; padding-top: 25px; margin-bottom: 50px; }
.sns { display: flex; flex-direction: column; gap: 10px; }
.sns a {
  font-weight: 600;
  text-decoration: none;
  color: #111;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sns a::after { content: "↗"; margin-left: auto; }
.sns a i { font-size: 18px; }

#contact-section { border-top: 1px solid #ddd; padding-top: 25px; margin-bottom: 50px; }
p.copyright { font-size: 12px; color: #555; text-align: center; margin-bottom: 50px; }

.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}
.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

@media(max-width:800px){
  .card { flex-direction: column; }
  .card .info { padding-left: 0; margin-top: 15px; }
}
</style>
</head>

<body>

<!-- (위쪽 동일 생략 없이 유지) -->

<section id="coversongs" class="fade-in">
<h2>Cover songs</h2>

<div class="card">
  <div class="video-wrap">
    <video controls preload="metadata">
      <source src="https://raw.githubusercontent.com/sawadaon/sawadaon/main/QkcdLXbsLZ7JxoZk.mp4" type="video/mp4">
    </video>
  </div>
  <div class="info">
    <div class="title">ゴーストアベニュー</div>
    <div class="credit">
      <p>music: Eve</p>
      <p>ed / mix / ma: かのん</p>
      <p>covered by: 沢多恩</p>
      <p class="note">※ 本家様の動画をお借りしてます</p>
    </div>
  </div>
</div>

<div class="card">
  <div class="video-wrap">
    <video controls preload="metadata">
      <source src="https://raw.githubusercontent.com/sawadaon/sawadaon/main/Tele.mp4" type="video/mp4">
    </video>
  </div>
  <div class="info">
    <div class="title">テレパシ</div>
    <div class="credit">
      <p>music: DECO*27</p>
      <p>ed / mix / ma: Juntae Kim</p>
      <p>covered by: 沢多恩</p>
      <p class="note">※ 本家様の動画をお借りしてます</p>
    </div>
  </div>
</div>
</section>

<!-- 이하 동일 -->
