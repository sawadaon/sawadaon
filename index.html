<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沢多恩</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f2f3f6;
  --panel:#ffffff;
  --line:#d9dde3;
  --text:#1a1d21;
  --sub:#6b7280;
}

html{scroll-behavior:smooth;}

body{
  margin:0;
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--text);
  line-height:1.7;
}

/* 상단 */
header{
  max-width:900px;
  margin:80px auto 40px;
  padding:0 20px;
}

h1{
  font-size:28px;
  margin:0 0 10px;
  font-weight:600;
  letter-spacing:2px;
}

nav{
  margin-top:20px;
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  letter-spacing:1px;
}

/* 공통 섹션 */
section{
  max-width:900px;
  margin:60px auto;
  padding:0 20px;
}

h2{
  font-size:14px;
  letter-spacing:2px;
  margin-bottom:20px;
}

/* 소개 */
.about{
  border-top:1px solid var(--line);
  padding-top:25px;
  color:var(--sub);
  font-size:14px;
}

/* 영상 카드 */
.card{
  border:1px solid var(--line);
  background:var(--panel);
  margin-bottom:40px;
}

.card iframe{
  width:100%;
  height:400px;
  border:0;
}

.credit{
  padding:18px 22px;
  font-size:13px;
  color:var(--sub);
  border-top:1px solid var(--line);
  line-height:1.8;
}

/* contact */
.contact{
  border-top:1px solid var(--line);
  padding-top:20px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>沢多恩 / Sawada On</h1>
  <nav>
    <a href="#about">ABOUT</a>
    <a href="#works">WORKS</a>
    <a href="#contact">CONTACT</a>
  </nav>
</header>

<section id="about" class="about">
初めまして、沢多恩（さわだおん）と申します。  
好きな曲を歌ったり演奏したり調声したりしています。
</section>

<section id="works">
<h2>WORKS</h2>

<div class="card">
  <iframe src="https://www.youtube.com/embed/hALBKqm9QFQ" allowfullscreen></iframe>
  <div class="credit">
    <strong>Original：</strong>Kai様<br>
    <strong>Vocal：</strong>沢音オフ<br>
    <strong>Tuning / Mix：</strong>沢多恩<br>
    <strong>Illustration：</strong>yoake様
  </div>
</div>

</section>

<section id="contact" class="contact">
<h2>CONTACT</h2>
sawadaon3@gmail.com
</section>

</body>
</html>
